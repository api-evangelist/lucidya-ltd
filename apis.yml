aid: lucidya-ltd
name: Lucidya Ltd
description: >-
  Lucidya is an AI-native customer experience management (CXM) platform for
  social listening, unified customer data, omnichannel engagement, surveys, and
  AI-powered text analysis, with deep Arabic-language and MENA-market
  capabilities. Its public developer platform (docs.lucidya.com) exposes a suite
  of RESTful APIs across six products — Social Listening, AI, CDP, OmniChannel,
  OmniServe Analytics, and Webhooks — for programmatic access to social data,
  customer profiles, analytics, AI text/audio models, and real-time event
  notifications. Lucidya is a 500 Global portfolio company headquartered in Saudi
  Arabia and is certified for SOC 2 Type 2 and ISO 27001.
url: https://raw.githubusercontent.com/api-evangelist/lucidya-ltd/refs/heads/main/apis.yml
accessModel:
  pricing: published
  onboarding: approval-required
  trial: false
  try_now: false
  public: false
  label: Docs public, key requires CSM approval
  confidence: high
  source:
  - authentication
  - plans
  generated: '2026-08-13'
  method: searched
  note: >-
    Corrected 2026-08-13. Documentation and all five OpenAPI documents are fully
    public and unauthenticated, but an API key is not self-serve: a customer must
    file a "Request Access" ticket that a Customer Success Manager approves before
    the Generate API Key control appears. OmniServe list pricing is published
    ($125 and $250 per seat per month); Social Listening pricing is
    talk-to-sales.
image: https://lh3.googleusercontent.com/d/1rlLPfBLpzoGQ2qAS_b9JeAxSnoyaa6RQ
x-type: company
