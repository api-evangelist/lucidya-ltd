aid: lucidya-ltd
name: Lucidya Ltd
description: >-
  Lucidya is an AI-native customer experience management (CXM) platform for
  social listening, unified customer data, omnichannel engagement, surveys, and
  AI-powered text analysis, with deep Arabic-language and MENA-market
  capabilities. Its public developer platform (docs.lucidya.com) exposes a suite
  of RESTful APIs across six products — Social Listening, AI, CDP, OmniChannel,
  OmniServe Analytics, and Webhooks — for programmatic access to social data,
  customer profiles, analytics, AI text/audio models, and real-time event
  notifications. Lucidya is a 500 Global portfolio company headquartered in Saudi
  Arabia and is certified for SOC 2 Type 2 and ISO 27001.
