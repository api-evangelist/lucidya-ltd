  /profiles:
    get:
      tags:
      - Profiles
      summary: Get a list of all profiles
      description: 'This **Critical Endpoint** grants access to a detailed list, encompassing every profile
        along with the data specific to each one.


        This endpoint will retrieve a list of **profile IDs**. To fetch detailed information for a specific
        user (customer) using their ID, please refer to [get profile data by Id endpoint](https://docs.lucidya.com/docs/cdp-api/branches/main/b0aykazg3489q-get-custom-profile-data-by-id).


        <!-- theme: success -->

        > #### 🔢 Pagination

        >

        > This endpoint enables pagination by using a `page` parameter, which is included in the request
        query parameters.


        You can obtain a summary of data for each profile as follows:


        - **Information**: This field consists of an array containing key details of the customer profile,
        such as `profile_image_url`, `identifier`, `name`, and `identifier_source`.

        - **Segments**: This field is an array that encompasses all the segments associated with the customer.

        - **Sources**: This field comprises an array detailing all the data sources linked to the customer,
        such as X, TikTok.

        - **Completeness_Rate (%)**: This object offers a metric evaluating the completeness of the customer''s
        profile data. A higher rate indicates a richer and more detailed set of details and insights about
        the customer.

        '
      operationId: getProfileList
      parameters:
      - name: luc-authorization
        in: header
        description: This is used to add the `API key` generated from your Lucidya account to authenticate.
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: 'This is utilized to add a `page number` for the subsequent payload. You can find
          the `"total_pages": 3` attribute on the first payload.'
        schema:
          type: integer
          example: '1'
        examples:
          default:
            value: '1'
      - name: start_date
        in: query
        description: This is utilized to specify a `start_date` filter using the Unix format, for example,
          `1709164800`.
        required: true
        schema:
          type: integer
          example: '1709164800'
        examples:
          default:
            value: '1709164800'
      - name: end_date
        in: query
        description: This is utilized to specify an `end_date` filter using the Unix format, for example,
          `1710460799`.
        required: true
        schema:
          type: integer
          example: '1710460799'
        examples:
          default:
            value: '1710460799'
