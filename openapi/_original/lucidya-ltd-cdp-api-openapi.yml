    post:
      tags:
      - Profiles
      summary: Create Profile
      description: This endpoint allows you to create a new CDP profile.
      operationId: createProfile
      parameters:
      - name: luc-authorization
        in: header
        description: This is used to add the `API key` generated from your Lucidya account to authenticate.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The user name of the profile, only accepts letters, digits, spaces, underscores
                    and hyphen.
                data:
                  type: object
                  description: At least one of the values of phone, email or social media account should
                    be provided.
                  properties:
                    email:
                      type: string
                    phone_number:
                      type: string
                    twitter:
                      type: string
                    facebook:
                      type: string
                    instagram:
                      type: string
                    intercom:
                      type: string
                    gmail:
                      type: string
                    whatsapp:
                      type: string
                    tiktok:
                      type: string
              x-examples:
                Example 1:
                  name: LucidyaUser
                  data:
                    email: user@example.com
                    phone_number: '+966583827'
                    twitter: user_example
                    facebook: user_example
                    instagram: user_example
                    intercom: user@example.com
                    gmail: user@example.com
                    whatsapp: '+1234567890'
                    tiktok: user_example
            examples:
              Example:
                value:
                  name: LucidyaUser
                  data:
                    email: user@example.com
                    phone_number: '+966583827'
                    twitter: user_example
                    facebook: user_example
                    instagram: user_example
                    intercom: user@example.com
                    gmail: user@example.com
                    whatsapp: '+1234567890'
                    tiktok: user_example
      responses:
        '200':
          description: Successful Operation - OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Type of response message.
                  profile_id:
                    type: integer
                    description: The unique identifier for the created profile.
                x-examples:
                  Example 1:
                    message: Profile created successfully
                    profile_id: 47423
              examples:
                default:
                  value:
                    profile_id: 47423
                    message: Profile created successfully
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
              examples:
                default:
                  value:
                    examples:
                      example_0:
                        value:
                          error:
                            status: 400
                            detail: invalid base64
                      example_1:
                        value:
                          message: 'You already added this {field_name}: {field_value}'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
              examples:
                default:
                  value:
                    examples:
                      example_0:
                        value:
                          error:
                            status: 401
                            detail: Failure of getting data due to token not found
