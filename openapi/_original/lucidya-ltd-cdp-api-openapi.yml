    put:
      tags:
      - Profiles
      summary: Update Profile
      description: This endpoint allows you to update CDP profile data.
      operationId: updateProfile
      parameters:
      - name: luc-authorization
        in: header
        description: This is used to add the `API key` generated from your Lucidya account to authenticate.
        required: true
        schema:
          type: string
      - name: id
        in: query
        description: The unique identifier of the profile.
        required: true
        schema:
          type: integer
          example: '229102'
        examples:
          default:
            value: '229102'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  description: At least one of the values of name, phone, email, or social media account
                    should be provided along with an action. If the action is delete, a field ID must
                    be provided.
                  items:
                    type: object
                    properties:
                      field_value:
                        type: string
                        description: Add the value you want to update it.
                      field_name:
                        type: string
                        description: Add the field name you want to select it.
                      action:
                        type: string
                        description: Add the action as an `add` type to update the value or `delete` to
                          delete the value.
                      id:
                        type: integer
                        description: The field id for the delete action.
                  example:
                  - field_value: Test_user
                    field_name: name
                    action: add
                  - field_value: user@example.com
                    field_name: email
                    action: delete
                    id: 123
