                            "editable": false,
                            "id": null
                        }
                    ],
                    "phone_number": [],
                    "email": [],
                    "twitter": [
                        {
                            "value": "harbi_nh",
                            "editable": false,
                            "id": null
                        }
                    ],
                    "segments": []
                },
                "basic_info": {
                    "gender": "male",
                    "location": {
                        "name": "",
                        "code": ""
                    },
                    "dialect": "",
                    "sub_dialect": "",
                    "sentiment": "",
                    "main_themes": [],
                    "sub_themes": []
                }
            }
