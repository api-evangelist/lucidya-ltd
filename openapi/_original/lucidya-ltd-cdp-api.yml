      summary: Create Profile
      description: This endpoint allows you to create a new CDP profile.
      operationId: createProfile
      parameters:
        - name: luc-authorization
          in: header
          description: This is used to add the `API key` generated from your Lucidya account to authenticate.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'The user name of the profile, only accepts letters, digits, spaces, underscores and hyphen.'
                data:
                  type: object
                  description: 'At least one of the values of phone, email or social media account should be provided.'
                  properties:
                    email:
                      type: string
                    phone_number:
                      type: string
                    twitter:
                      type: string
                    facebook:
                      type: string
                    instagram:
                      type: string
                    intercom:
                      type: string
                    gmail:
                      type: string
                    whatsapp:
                      type: string
                    tiktok:
                      type: string
              x-examples:
                Example 1:
                  name: LucidyaUser
                  data:
                    email: user@example.com
                    phone_number: '+966583827'
                    twitter: user_example
                    facebook: user_example
                    instagram: user_example
                    intercom: user@example.com
                    gmail: user@example.com
                    whatsapp: '+1234567890'
                    tiktok: user_example
