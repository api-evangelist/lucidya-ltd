  /profiles/interactions:
    post:
      tags:
        - Profile Interactions
      summary: Create interaction profile
      description: |
        This endpoint enables you to execute a `POST` request by including the following parameters:

        - `start_date`: Defines the `Unix` timestamp marking the beginning of the interaction period on the customer's profile.
        - `end_date`: Sets the `Unix` timestamp that signifies the end of the interaction period on the customer's profile.
        - `profile_id`: Acts as the unique identifier for the customer.

        Upon successful submission, the endpoint will return a `job_id`.

        This `job_id` serves as a key to **access all interactions** tied to a specific customer.

        For more information on how to retrieve interactions for a particular customer using their `Id` and `job_id`, please check [retrieve interaction profile endpoint](https://docs.lucidya.com/docs/cdp-api/branches/main/m7c5hv4h94339-get-interaction-profile).
      operationId: createInteractionProfile
      parameters:
        - name: luc-authorization
          in: header
          description: This is used to add the `API key` generated from your Lucidya account to authenticate.
          required: true
          schema:
            type: string
        - name: start_date
          in: query
          description: 'This is utilized to specify a `start_date` filter using the Unix format, for example, `1713033600`.'
          required: true
          schema:
            type: integer
            example: '1713033600'
          examples:
            default:
              value: '1713033600'
        - name: end_date
          in: query
          description: 'This is utilized to specify an `end_date` filter using the Unix format, for example, `1715625600`.'
          required: true
          schema:
            type: integer
            example: '1715625600'
          examples:
            default:
              value: '1715625600'
        - name: profile_id
          in: query
          description: This is the unique identifier of the customer profile.
          required: true
          schema:
            type: integer
            example: '46597'
          examples:
            default:
              value: '46597'
      requestBody:
        content: {}
      responses:
        '200':
          description: |-
