  /omnichannel/twitter/widget_data:
    post:
      tags:
      - Social Media > X (Twitter)
      summary: Create a Job to Retrieve Twitter Widgets
      description: 'Use this endpoint to create a request for X widget names and get the `job_id` to [get
        widgets analysis for the channel


        <!-- theme: info -->

        > #### Note

        >

        > You can specify a maximum of **5 widget names** and apply a Unix date filter for **up to 30
        days**.


        <!-- theme: success -->

        > #### Tip

        >

        > Use `page_name` as `TWITTER_PUBLIC` for Twitter public channel or `TWITTER_PRIVATE` for Twitter
        private (direct message) channel to can get the required widgets.'
      operationId: createTwitterWidgetData
      parameters:
      - name: luc-authorization
        in: header
        description: This is used to add the `API key` generated from your Lucidya account to authenticate.
        required: true
        schema:
          type: string
      - name: monitors_list
        in: query
        description: Use this to add monitors list ID(s) for the channel(s).
        required: true
        schema:
          type: array
          example: '[75419]'
        examples:
          default:
            value: '[75419]'
      - name: page_name
        in: query
        description: Use this to add the page name or source name, example in this endpoint, `TWITTER_PUBLIC`
          or `TWITTER_PRIVATE`.
        required: true
        schema:
          type: string
          example: TWITTER_PRIVATE
        examples:
          default:
            value: TWITTER_PRIVATE
