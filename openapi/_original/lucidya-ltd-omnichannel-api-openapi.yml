                            response_rate: 0
        '401':
          description: Unauthorized! Invalid authentication credentials or Failure of getting data due
            to in-active company.
          content:
            application/json:
              schema:
                type: object
              examples:
                Unauthorized:
                  value:
                    message: Invalid authentication credentials
        '503':
