components:
  schemas:
    ChannelList:
      type: object
      description: This module provides a list of all connected channels' data within the OmniChannel
        product.
      properties:
        id:
          type: string
          description: This is the identified ID of the monitor.
        type:
          type: string
          description: This is the type of monitor, and in this case, it's a `channel`.
        attributes:
          type: object
          description: This is a data attribute for the channel.
          properties:
            id:
              type: integer
              description: This is the identified ID of the channel.
            status:
              type: string
              description: This provides the current status of the channel.
            name:
              type: string
              description: This is the name of the connected channel.
            monitor_type_name:
              type: string
              description: 'This provides the monitor type name, and there are two types:


                - `ACCOUNT_ANALYSIS`: This means this is a public analytics for this connected channel.

                - `Monitor_dm_configuration`: This means this is a private analytics for this connected
                channel.'
            paused:
              type: integer
              description: This indicates whether this channel is paused or not.
            created_at:
              type: string
              description: This provides the created/connected date for this channel.
            data_sources:
              type: array
              description: This provides a list of data sources for this channel.
              items:
                type: string
            is_engagement_monitor:
              type: boolean
              description: This indicates whether this channel is an engagement monitor or not.
            added_by:
              type: string
              description: This provides the user who added this channel on OmniChannel.
            authenticated_by:
              type: string
              description: This provides the user who authenticated this channel on OmniChannel.
            data_category:
              type: string
              description: 'This indicates which category this channel belongs to.


                Check [categories endpoint](https://docs.lucidya.com/docs/omnichannel-api/branches/main/1ff0a71d0d8c6-get-categories)
                to view all categories on OmniChannel.'
            channel:
              type: array
              description: This provides a name list of connected channel(s).
              items:
                type: string
            account_name:
              type: string
              description: This indicates the social account name for the connected channel.
            total_count:
              type: integer
            third_party_unique_id:
              type: string
              description: This indicates the unique social ID for the connected channel.
            percentage:
              type: number
            stream_status:
              type: string
              description: This represents the streaming status for the channel.
            monitor_owner:
              type: boolean
              description: This indicates whether this user is the monitor owner or not.
            disable_reauth:
              type: boolean
            dm_channel:
              type: integer
              description: This indicates whether this channel is a direct messaging channel or not.
            dm_configuration_id:
              type: integer
              description: This represents the unique direct message configuration ID.
            limit_error:
              type: array
              items:
                type: string
            account_error:
              type: array
              items:
                type: string
            account_tiktok_token_error:
              type: boolean
            account_valid_error:
              type: array
              items:
                type: string
            is_dm:
              type: boolean
              description: This indicates whether this channel is a direct messaging channel or not.
            auth_error_login:
              type: array
              items:
                type: string
            auth_error_permission:
              type: array
              items:
                type: string
            customer_care_accounts:
              type: array
              items:
                type: string
    Categories:
      type: object
      description: This module provides all categories with all available data sources for each one and
        the main categories on the OmniChannel product.
      properties:
        name:
          type: string
          description: This is the name of the category/section. You can use this name for the relevant
            endpoint(s) on OmniChannel.
        data_sources:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceItem'
        main_categories:
          type: array
          description: This provides a list of main categories on OmniChannel, like `analytics` and `interactions`
            categories.
          items:
            type: string
    DataSourceItem:
      type: object
      description: This module provides a list of all data sources for a specific category.
      properties:
        id:
          type: integer
          description: This is the unique identifier of the data source.
        source:
          type: string
          description: This is the name of the source, page, or connected channel. You can use this name
            for the relevant endpoint(s) on OmniChannel.
      required:
      - id
      - source
    WidgetConfig:
      type: object
      description: This module provides a list of all widget names for the provided page name/data source/social
        channel.
      properties:
        page_name:
          type: string
          description: The name of the social media/channel page.
          example: TWITTER_PUBLIC
        widgets_names:
          type: array
          description: A list of available widget names for the provided page name.
          items:
            type: string
        company_time_zone:
          type: integer
          description: The company's time zone offset from GMT+3.
          example: -1
        section_name:
          type: string
          description: The section or category the channel/page belong to.
          example: social
    JobResult:
      type: object
      properties:
        job_id:
          type: string
          description: The unique identifier of the job.
          example: 3e6d9c25-14dc-4e9e-9f59-98e4a377ebf4
        widgets_names:
          type: array
          description: 'A list of widget names for which results are available. This may be a subset of
            the widgets requested in the original job.

            '
          items:
            type: string
    WidgetDataResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            widget_data:
              type: object
              description: The structure of this object is variable depending on the widget type and data.
