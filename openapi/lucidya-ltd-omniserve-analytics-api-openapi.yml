      description: 'This endpoint enables you to create a job that returns, per engagement, the applied

        custom-field values for the given period and filters. It returns a `job_id` you then

        poll via `GET /analytics/custom_fields` to retrieve paginated results.


        **Note:** Results are paginated (10 engagements per page). When more pages exist, the

        index response includes `next_page_job_id` to fetch the next page.

        '
      operationId: createCustomFieldsJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start_date:
                  type: integer
                  description: Unix timestamp for start date
                  format: int64
                  example: 1727395200
                end_date:
                  type: integer
                  description: Unix timestamp for end date
                  format: int64
                  example: 1728000000
                monitors:
                  type: string
                  description: Comma-separated monitor IDs
                  example: 101,102
                page_number:
                  type: integer
                  description: Page number to fetch (defaults to 1)
                  example: 1
                filters:
                  type: object
                  description: Filter object (optional)
                  example:
                    data_sources: twitter,facebook
                    engagement_types: posts,direct_messages,emails
                    routings_ids: '5'
                    tags_ids: 10,12
                    exact_match: false
                    untagged_engagements: false
              required:
              - start_date
              - end_date
            examples:
              customFields:
                summary: Custom fields job with filters
                value:
                  start_date: 1727395200
                  end_date: 1728000000
                  monitors: 101,102
                  page_number: 1
                  filters:
                    data_sources: twitter,facebook
                    engagement_types: posts,direct_messages,emails
                    routings_ids: '5'
                    tags_ids: 10,12
                    exact_match: false
                    untagged_engagements: false
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                start_date:
                  type: integer
                  format: int64
                  example: 1760313600
                end_date:
                  type: integer
                  format: int64
                  example: 1760918399
                monitors:
                  type: string
                  description: Comma-separated monitor IDs
                  example: 45930,45922
                page_number:
                  type: integer
