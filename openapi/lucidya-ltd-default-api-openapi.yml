components:
  schemas:
    Categories:
      type: object
      description: This module provides all categories with all available data sources for each one and the main categories on the OmniChannel product.
      properties:
        name:
          type: string
          description: This is the name of the category/section. You can use this name for the relevant endpoint(s) on OmniChannel.
        data_sources:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceItem'
        main_categories:
          type: array
          description: This provides a list of main categories on OmniChannel, like `analytics` and `interactions` categories.
          items:
            type: string
    ChannelList:
      type: object
      description: This module provides a list of all connected channels' data within the OmniChannel product.
      properties:
        id:
          type: string
          description: This is the identified ID of the monitor.
        type:
          type: string
          description: This is the type of monitor, and in this case, it's a `channel`.
        attributes:
          type: object
          description: This is a data attribute for the channel.
          properties:
            id:
              type: integer
              description: This is the identified ID of the channel.
            status:
              type: string
              description: This provides the current status of the channel.
            name:
              type: string
              description: This is the name of the connected channel.
            monitor_type_name:
              type: string
              description: 'This provides the monitor type name, and there are two types:


                - `ACCOUNT_ANALYSIS`: This means this is a public analytics for this connected channel.

                - `Monitor_dm_configuration`: This means this is a private analytics for this connected channel.'
            paused:
              type: integer
              description: This indicates whether this channel is paused or not.
