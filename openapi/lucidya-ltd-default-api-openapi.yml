openapi: 3.2.0
info:
  version: 1.0.0
  title: OmniChannel Default API
  description: 'This document serves as the 📘 comprehensive API guide for 🔌 integrating your product(s) with the Lucidya **OmniChannel** via **RESTful** endpoints.


    🔍 Discover how to seamlessly integrate your offerings with our platform, enabling you to leverage social media, chat, ratings, calls, and interaction channels all in one place.


    [🎓 Learn more about Lucidya OmniChannel](https://lucidya.com/product/lucidya-omnichannel/).'
  termsOfService: https://lucidya.com/service-agreement/
  contact:
    name: Lucidya
    url: https://lucidya.com/
    email: customer.support@lucidya.com
servers:
- url: https://api.lucidya.com
  description: Production Server
tags:
- name: Default
  description: Operations related to default and main endpoints on OmniChannel.
paths:
  /monitors_list:
    get:
      tags:
      - Default
      summary: Get Channel List
      description: 'Use this endpoint to retrieve a comprehensive list of all connected channels within the **OmniChannel** product.


        <!-- theme: success -->

        > #### 🔢 Pagination

        >

        > This endpoint enables pagination by using a `page_id` parameter, which is included in the request query parameters. Each payload retrieves **10** channels.

        '
      operationId: getChannelList
      parameters:
      - name: luc-authorization
        in: header
        description: This is used to add the `API key` generated from your Lucidya account to authenticate.
        required: true
        schema:
          type: string
      - name: product_name
        in: query
        description: This specifies the product name, which in this case is `omnichannel`.
        required: true
        schema:
          type: string
          example: omnichannel
        examples:
          default:
            value: omnichannel
      - name: page_id
        in: query
        description: 'This adds a `page_id` for the subsequent payload. The current page can be identified by the `"page_number": "1"` attribute in the initial payload.'
        required: true
        schema:
          type: integer
          example: '1'
        examples:
          default:
            value: '1'
      responses:
        '200':
          description: A list of channels
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChannelList'
                  page_number:
                    type: string
                    description: This represents the current page number.
                  count:
                    type: integer
                    description: This represents the total number of connected channels.
              examples:
                ChannelListExample:
                  value:
