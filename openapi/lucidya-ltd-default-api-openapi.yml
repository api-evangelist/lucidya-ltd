  /omnichannel/base/categories:
    get:
      tags:
      - Default
      summary: Get Categories
      description: Retieve all categories with all available data sources for each one and the main categories on the OmniChannel product eg.. social media, reviews, calls,..etc
      operationId: getCategories
      parameters:
      - name: luc-authorization
        in: header
        description: This is used to add the `API key` generated from your Lucidya account to authenticate.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Categories'
              examples:
                Retrieve Categories:
                  value:
                    data:
                    - name: Social Media
                      data_sources:
                      - id: 1
                        source: TWITTER_PRIVATE
                      - id: 1
                        source: TWITTER_PUBLIC
                      - id: 2
                        source: FACEBOOK_PRIVATE
                      - id: 2
                        source: FACEBOOK_PUBLIC
                      - id: 3
                        source: INSTAGRAM_PUBLIC
                      - id: 3
                        source: INSTAGRAM_PRIVATE
                      - id: 20
                        source: LINKEDIN_PUBLIC
                      - id: 38
                        source: TIKTOK_PUBLIC
                    - name: chats
                      data_sources:
                      - id: 6
                        source: INTERCOM
                      - id: 9
                        source: WHATSAPP
                    - name: emails
                      data_sources:
                      - id: 7
                        source: GMAIL
                    - name: Ratings
                      data_sources:
                      - id: 15
                        source: GOOGLEMYBUSINESS
                    - name: Calls
                      data_sources:
                      - id: 27
                        source: GENESYS
                    - main_categories:
                      - analytics
                      - interactions
        '401':
          description: Unauthorized! Invalid authentication credentials or Failure of getting data due to in-active company.
          content:
            application/json:
              schema:
                type: object
              examples:
                Unauthorized:
                  value:
                    message: Invalid authentication credentials
        '504':
          description: Gateway Timeout! It means the server tried to load the data or fulfill another request but it took too long and timed out.
          content:
            application/json:
              schema:
                type: object
      servers:
      - url: https://api.lucidya.com
        description: Production Server
  /omnichannel/base/widgets:
    get:
      tags:
      - Default
      summary: Get Widget Names
      description: 'Retrieve a list of all widget names for a specific channel by using `page_name` and `section_name`.


        <!-- theme: success -->

        > #### Tip

        >

        > You can find all page names and their related section names on the [categories endpoint](https://docs.lucidya.com/docs/omnichannel-api/branches/main/oaihft14jx8iv-get-categories).'
      operationId: getWidgetNames
      parameters:
      - name: luc-authorization
        in: header
        description: This is used to add the `API key` generated from your Lucidya account to authenticate.
        required: true
        schema:
          type: string
      - name: page_name
        in: query
        description: Use this parameter to add the specific `page_name`, which means data source, like `TWITTER_PUBLIC`.
        required: true
        schema:
          type: string
          example: WHATSAPP
        examples:
          default:
            value: WHATSAPP
      - name: section_name
        in: query
        description: Use this parameter to add the related `section_name`, which means category, like `Social Media`.
        required: true
        schema:
          type: string
          example: chats
        examples:
          default:
            value: chats
      responses:
