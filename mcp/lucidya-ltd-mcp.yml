search_evidence:
  - what: Web search for a first-party Lucidya MCP server
    result: >-
      No Lucidya MCP server exists. Every result for "Lucidya MCP" resolves to
      Lucid (lucid.co / mcp.lucid.app) or Lucidworks — different companies with
      confusable names. Recorded explicitly so a later pass does not credit
      Lucidya with Lucid's server.
  - what: POST tools/list to plausible endpoints
    probes:
      - { url: 'https://mcp.lucidya.com/mcp', status: 0, note: DNS does not resolve }
      - { url: 'https://api.lucidya.com/mcp', status: 404, note: Kong "no Route matched with those values" }
      - { url: 'https://lucidya.com/mcp', status: 405, note: Webflow marketing site, not an MCP transport }
  - what: GitHub organisation github.com/lucidya
    status: 200
    result: Zero public repositories; no MCP server source, no npm/PyPI package.
  - what: Third-party repositories
    result: >-
      github.com/ahmed-salama22/lucidya-mcp and
      github.com/muzakkirhussain011/lucidya-mcp-prototype exist but are
      individual community experiments, not Lucidya-published, and are not
      treated as a provider surface.
