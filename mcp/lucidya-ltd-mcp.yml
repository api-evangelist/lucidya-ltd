build_notes:
  auth: >-
    A server would pass a single `luc-authorization` header. Because tokens are
    bound to one API product type and a maximum of three keys exist per type, a
    server covering all five products needs five distinct tokens, not one.
  ip_allowlist: >-
    Keys carry subnet IP allow-lists, so a hosted remote MCP server would need
    its egress ranges registered on the customer's key — a real obstacle to a
    vendor-hosted remote server and an argument for local-stdio.
  async: >-
    Fourteen of the candidate tools are job creators whose results arrive on a
    separate poll endpoint. A useful server would fold create-then-poll into one
    tool call rather than exposing both halves.
  rate_limits: >-
    6 requests/minute on the AI API is the binding constraint for any agent
    workload; a server must pace itself, since no RateLimit-* header is returned.
