shared_rules:
  auth: >-
    `luc-authorization: <token>` header on every call. Keys are bound to a single
    API product type — a Social Listening key will not open the AI API.
  idempotency: >-
    None exists anywhere in the surface. Every retried POST is a new request.
  rate_limits: >-
    100 requests/minute floor on four products, 6/minute on the AI API. Fixed
    window, resets on the minute. No RateLimit-* or Retry-After header is
    returned, so a client must self-pace.
  async: >-
    202 means "still running" on the OmniServe, OmniChannel and AI audio
    endpoints. Never treat any 2xx as final without checking the code.
  errors: >-
    Three envelope shapes are in production. See
    ../errors/lucidya-ltd-problem-types.yml.
