api_pricing:
  metered: false
  note: >-
    API calls are not separately metered or priced. API reach is a plan feature
    on OmniServe (limited vs full) and unstated on Social Listening. There is no
    published price for the AI API, CDP API or OmniChannel API on their own, and
    the AI API additionally requires the CXM Core product before a key can be
    issued. Rate limits are described as plan-dependent but no plan-to-limit
    mapping is published, so a buyer cannot determine their actual API ceiling
    before signing.
